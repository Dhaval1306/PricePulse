spring:
  datasource:
    url: jdbc:h2:mem:pricepulse_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  threads:
    virtual:
      enabled: true

telegram:
  bot:
    enabled: false
    token: test_token
    username: TestBot

scraper:
  jitter:
    min-ms: 10
    max-ms: 50
  retry:
    max-attempts: 2
    backoff-base-ms: 50
  concurrency:
    amazon: 2
    flipkart: 2
    default: 3
  ratelimit:
    amazon:
      max-requests: 3
      window-ms: 5000
    flipkart:
      max-requests: 3
      window-ms: 5000
    default:
      max-requests: 5
      window-ms: 5000

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 4
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 2s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      amazon:
        base-config: default
      flipkart:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,pricepulse"
  endpoint:
    health:
      show-details: always
    pricepulse:
      enabled: true
